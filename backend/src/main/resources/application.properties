spring.application.name=shareit-backend

# Server Configuration (Render injects PORT env variable)
server.port=${PORT:8080}

# Database Configuration (Externalized to Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shareit_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (Externalized to Environment Variable)
jwt.secret=${JWT_SECRET:your_default_jwt_secret_key_change_in_production_min_256_bits_length!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
