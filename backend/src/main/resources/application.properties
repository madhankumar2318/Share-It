spring.application.name=shareit-backend

# Server Configuration (Render injects PORT env variable)
server.port=${PORT:8080}

# Database Configuration (Externalized to Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shareit_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for Render / Cloud PostgreSQL)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (Externalized to Environment Variable)
jwt.secret=${JWT_SECRET:your_default_jwt_secret_key_change_in_production_min_256_bits_length!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Comma-separated; strictly forbids wildcard * when credentials are true)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:4173}
